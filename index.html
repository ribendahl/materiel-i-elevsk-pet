* {

}

body {

h1 {

    padding: 25px;
    border-radius: 18px;

}

#top {
    display: flex;
    gap: 12px;
    justify-content: center;
    flex-wrap: wrap;
    margin-bottom: 12px;
}

.stat {
    background: #f3f7fb;
    padding: 10px 16px;

    font-weight: bold;
    color: #004080;
}

#level {
    margin: 8px 0;
    color: #004080;
}

#score,
#highscore {
    font-size: 20px;
    font-weight: bold;
    margin: 7px;
}

#highscore {
    color: #b8860b;
}

#progressBox {
    margin: 18px auto;
    max-width: 600px;
}

#progressText {
    font-weight: bold;
    margin-bottom: 8px;
}

.progressBar {
    width: 100%;
    height: 18px;
    background: #e0e0e0;
    border-radius: 10px;
    overflow: hidden;
}

#progressFill {
    height: 100%;
    width: 0%;
    background: #0078d7;
    transition: width .4s ease;
}

#ladder {
    text-align: left;
    margin: 20px auto;
    max-width: 470px;
    background: #f7f7f7;
    padding: 14px;
    border-radius: 12px;
}

.levelStep {
    position: relative;
    padding: 9px 10px 9px 48px;
    margin: 3px 0;
    border-radius: 7px;
    color: #777;
}

.levelStep.current {
    background: gold;
    color: #000;
    font-weight: bold;
}

.levelStep.completed {
    color: #228b22;
    font-weight: bold;
}

.levelStep.locked {
    color: #999;
}

.levelArrow {
    position: absolute;
    left: 12px;
    font-size: 20px;
}

.levelConnector {
    margin-left: 23px;
    border-left: 3px solid #ccc;
    height: 7px;
}

#question {
    margin-top: 25px;
    min-height: 40px;
}

#questionType {
    font-size: 14px;
    color: #777;
    font-weight: bold;
    margin-bottom: 8px;
}

#imageArea {
    min-height: 210px;
    display: flex;
    justify-content: center;
    align-items: center;
    margin: 12px auto;
}

#questionImage {
    max-width: 300px;
    max-height: 210px;
    object-fit: contain;
    border: 2px solid #ddd;
    border-radius: 12px;
    padding: 10px;
    background: white;
}

#answers {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
    margin-top: 15px;
}

.answerButton {
    padding: 12px 18px;
    margin: 0;
    cursor: pointer;
    border: none;
    background: #0078d7;
    color: white;
    border-radius: 9px;
    font-size: 16px;
    min-width: 220px;
}

.answerButton:hover {
    background: #005ea6;
}

.answerButton:disabled {
    cursor: default;
    opacity: 0.7;
}

.correct {
    color: green;
    font-weight: bold;
}

.wrong {
    color: red;
    font-weight: bold;
}

#feedback {
    min-height: 60px;
    font-size: 18px;
    margin-top: 15px;
}

#nextButton {
    display: none;
    background: #228b22;
}

#restartButton {
    display: none;
    background: #004080;
}

.medal {
    font-size: 60px;
}

.small {
    font-size: 13px;
    color: #666;
}

.correctAnswer {
    display: block;
    margin-top: 10px;
    font-size: 20px;
    color: #004080;
    font-weight: bold;
}

.countdown {
    font-size: 14px;
    color: #777;
    margin-top: 8px;
}

#error {
    display: none;
}
</style>

let level = 0;
let score = 0;
let currentQuestion = null;
let questionNumber = 0;
let answered = false;
let remainingQuestions = [...questions];
let highscore = 0;
let nextTimer = null;


try {
    highscore = Number(localStorage.getItem("materielHighscore")) || 0;
} catch (e) {
    highscore = 0;
}


function getRandomQuestion() {

    if (!remainingQuestions.length) {
        remainingQuestions = [...questions];
    }

    const i = Math.floor(
        Math.random() * remainingQuestions.length
    );

    return remainingQuestions.splice(i, 1)[0];
}


function shuffle(arr) {
    return [...arr].sort(() => Math.random() - 0.5);
}


function showQuestion() {

    if (nextTimer) {
        clearTimeout(nextTimer);
        nextTimer = null;
    }

    answered = false;

    currentQuestion = getRandomQuestion();

    questionNumber++;

    document.getElementById("questionCounter").textContent =
        "Fråga " + questionNumber;

    document.getElementById("typeCounter").textContent =
        currentQuestion.type === "image"
            ? "Bildfråga"
            : "Kunskapsfråga";

    document.getElementById("questionType").textContent =
        currentQuestion.type === "image"
            ? "👀 Känn igen materielen"
            : "🧠 Vad kan du om materielen?";


    const imageArea = document.getElementById("imageArea");

    imageArea.innerHTML = "";


    if (currentQuestion.type === "image") {

        const img = document.createElement("img");

        img.id = "questionImage";

        img.alt = "Bild på laborationsutrustning";

        /*
         * Bilderna ligger direkt bredvid index.html.
         * Därför används bara filnamnet här.
         */
        img.src = currentQuestion.img;

        img.onerror = function () {

            imageArea.innerHTML =
                '<p class="wrong">' +
                'Bilden kunde inte laddas.<br>' +
                'Kontrollera att filen <b>' +
                currentQuestion.img +
                '</b> ligger bredvid index.html.' +
                '</p>';

        };

        imageArea.appendChild(img);
    }


    document.getElementById("question").textContent =
        currentQuestion.q;


    const answers =
        document.getElementById("answers");

    answers.innerHTML = "";


    shuffle(currentQuestion.options).forEach(option => {

        const button =
            document.createElement("button");

        button.className = "answerButton";

        button.textContent = option;

        button.onclick = function () {
            checkAnswer(option);
        };

        answers.appendChild(button);

    });


    document.getElementById("feedback").innerHTML = "";

    document.getElementById("nextButton").style.display =
        "none";

    document.getElementById("restartButton").style.display =
        "none";

    updateDisplay();
}


function checkAnswer(answer) {

    if (answered) {
        return;
    }

    answered = true;


    const correct =
        answer === currentQuestion.answer;


    document
        .querySelectorAll("#answers .answerButton")
        .forEach(button => {
            button.disabled = true;
        });


    if (correct) {

        level++;

        score += 10;


        document.getElementById("feedback").innerHTML =
            '<span class="correct">' +
            '✅ Rätt! +10 poäng!' +
            '</span>';


        if (score > highscore) {

            highscore = score;

            try {
                localStorage.setItem(
                    "materielHighscore",
                    highscore
                );
            } catch (e) {}

        }


        updateDisplay();


        if (level >= 10) {

            finishGame();

            return;
        }


        document.getElementById("nextButton").style.display =
            "inline-block";

    }


    else {

        /*
         * Vid fel:
         * - nivån går tillbaka till 0
         * - poängen går tillbaka till 0
         * - rätt svar visas
         * - eleven får 5 sekunder att läsa svaret
         * - därefter kommer nästa fråga automatiskt
         */

        level = 0;

        score = 0;


        document.getElementById("feedback").innerHTML =
            '<span class="wrong">' +
            '❌ Fel svar!' +
            '</span>' +

            '<span class="correctAnswer">' +
            'Rätt svar: ' +
            currentQuestion.answer +
            '</span>' +

            '<span class="countdown">' +
            'Nästa fråga om 5 sekunder...' +
            '</span>';


        updateDisplay();


        let secondsLeft = 5;

        const countdown =
            document.querySelector(".countdown");


        nextTimer = setInterval(function () {

            secondsLeft--;

            if (secondsLeft > 0) {

                countdown.textContent =
                    "Nästa fråga om " +
                    secondsLeft +
                    " sekunder...";

            }

        }, 1000);


        setTimeout(function () {

            clearInterval(nextTimer);

            nextTimer = null;

            showQuestion();

        }, 5000);

    }

}


document
    .getElementById("nextButton")
    .addEventListener("click", function () {

        showQuestion();

    });


function finishGame() {

    document.getElementById("questionType").textContent =
        "🏆 Avklarat!";


    document.getElementById("question").innerHTML =
        "🏆 DU ÄR KEMIMÄSTARE!";


    document.getElementById("imageArea").innerHTML =
        '<div class="medal">🥇</div>';


    document.getElementById("answers").innerHTML =
        '<h2>Fantastiskt jobbat!</h2>' +
        '<p>Du klarade 10 nivåer och fick ' +
        '<strong>' + score + ' poäng</strong>.</p>' +
        '<p class="small">' +
        'Nu känner du igen materielen och vet vad den används till.' +
        '</p>';


    document.getElementById("feedback").innerHTML = "";


    document.getElementById("nextButton").style.display =
        "none";


    document.getElementById("restartButton").style.display =
        "inline-block";


    updateDisplay();
}


document
    .getElementById("restartButton")
    .onclick = function () {

        location.reload();

    };


function updateDisplay() {

    document.getElementById("level").textContent =
        "Nivå " + level;


    document.getElementById("score").textContent =
        "Poäng: " + score;


    document.getElementById("highscore").textContent =
        "🏆 Rekord: " + highscore;


    document.getElementById("progressFill").style.width =
        Math.min(level / 10 * 100, 100) + "%";


    document.getElementById("progressText").textContent =
        level + " av 10 nivåer avklarade";


    let html = "";


    for (let i = 10; i >= 0; i--) {

        let state =
            i === level
                ? "current"
                : i < level
                    ? "completed"
                    : "locked";


        let arrow =
            i === level
                ? "👉"
                : i < level
                    ? "✓"
                    : "🔒";


        html +=
            '<div class="levelStep ' +
            state +
            '">' +

            '<span class="levelArrow">' +
            arrow +
            '</span>' +

            levels[i] +

            '</div>';


        if (i > 0) {

            html +=
                '<div class="levelConnector"></div>';

        }

    }


    document.getElementById("ladder").innerHTML =
        html;
}


window.addEventListener("error", function (event) {

    const box =
        document.getElementById("error");

    box.style.display = "block";

    box.textContent =
        "JavaScript-fel: " +
        event.message;

});


try {

        document.getElementById("error");

    box.style.display = "block";

    box.textContent =
        "Spelet kunde inte starta: " +

}
